name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller
      - name: Verify source
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile src/serial_loss_analyzer.py src/frame_parser.py src/serial_loss_gui.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean SerialLossAnalyzer.spec
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\\dist\\SerialLossAnalyzer.exe" -Algorithm SHA256).Hash
          "$hash  SerialLossAnalyzer.exe" | Set-Content ".\\dist\\SHA256SUMS.txt" -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SerialLossAnalyzer.exe
            dist/SHA256SUMS.txt
