name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check source syntax
        run: python -m py_compile src/serial_loss_analyzer.py src/frame_parser.py src/serial_loss_gui.py
